name: Build Flixie APK

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore (optional)
        # Add repo secrets FLIXIE_KEYSTORE_BASE64, FLIXIE_KEYSTORE_PASSWORD,
        # FLIXIE_KEY_ALIAS, FLIXIE_KEY_PASSWORD to sign with your own persistent key.
        # If absent, the build falls back to the debug key (still installable).
        env:
          KS_B64: ${{ secrets.FLIXIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/flixie-release.jks"
            echo "FLIXIE_KEYSTORE_FILE=$RUNNER_TEMP/flixie-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Stable Release APK
        # Flavors are stable + prerelease; assembleRelease is not a single task.
        # stableRelease does not require the upstream CloudStream keystore.
        run: ./gradlew assembleStableRelease --stacktrace
        env:
          FLIXIE_KEYSTORE_PASSWORD: ${{ secrets.FLIXIE_KEYSTORE_PASSWORD }}
          FLIXIE_KEY_ALIAS: ${{ secrets.FLIXIE_KEY_ALIAS }}
          FLIXIE_KEY_PASSWORD: ${{ secrets.FLIXIE_KEY_PASSWORD }}
          # Optional signing – set these secrets in your repo to sign the APK
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          # Optional API keys (leave empty if not needed)
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          echo "Found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -la app/build/outputs/apk/ || true
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: flixie-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mapping (if present)
        uses: actions/upload-artifact@v4
        with:
          name: flixie-mapping
          path: app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: ignore
          retention-days: 14
